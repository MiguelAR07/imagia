<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" width="330" height="72" role="img" aria-label="IMAGIA · Software · Apps · Automatización">
  <!-- Firma horizontal para fondo oscuro. Usa Schibsted Grotesk y JetBrains Mono (Google Fonts).
       Antes de enviar a imprenta, convertir los textos a trazos en un editor vectorial. -->
  <defs>
    <linearGradient id="imagia-a" gradientUnits="userSpaceOnUse" x1="6" y1="47" x2="36" y2="17"><stop offset="0" stop-color="#3B5BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="imagia-b" gradientUnits="userSpaceOnUse" x1="27" y1="17" x2="57" y2="47"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B5BFF"/></linearGradient>
    <linearGradient id="imagia-ia" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B5BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <mask id="imagia-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M39.4 46.77 A15 15 0 0 1 31.4 42.6" fill="none" stroke="#000" stroke-width="12"/>
    </mask>
  </defs>
  <g transform="translate(0 4)">
