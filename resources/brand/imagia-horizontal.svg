    <rect x="6" y="17" width="30" height="30" rx="9" fill="none" stroke="url(#imagia-a)" stroke-width="6.5" mask="url(#imagia-cut)"/>
    <g fill="#ECEEF3"><rect x="13" y="25" width="10" height="3.4" rx="1.7"/><rect x="13" y="31" width="6" height="3.4" rx="1.7" opacity=".5"/></g>
    <circle cx="57" cy="32" r="3.6" fill="#FFFFFF"/>
  </g>
  <text x="78" y="44" font-family="'Schibsted Grotesk', 'Segoe UI', sans-serif" font-weight="800" font-size="38" letter-spacing="2.3" fill="#ECEEF3">IMAG<tspan fill="url(#imagia-ia)">IA</tspan></text>
  <text x="79" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-weight="500" font-size="8.4" letter-spacing="2.4" fill="#9097A6">SOFTWARE · APPS · AUTOMATIZACIÓN</text>
